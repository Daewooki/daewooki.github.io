name: Auto Generate Blog Posts

on:
  # 매일 오전 9시 (KST) = UTC 00:00에 실행
  schedule:
    - cron: '0 0 * * *'

  # 수동 실행
  workflow_dispatch:
    inputs:
      num_posts:
        description: '생성할 포스트 개수 (1-4)'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate blog posts with web search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NUM_POSTS: ${{ github.event.inputs.num_posts || '2' }}
        run: |
          python scripts/generate_post.py

      - name: Detect new posts
        id: detect
        run: |
          git add _posts/ scripts/post_history.json
          if git diff --staged --name-only | grep -q '^_posts/'; then
            echo "has_new_posts=true" >> "$GITHUB_OUTPUT"
            echo "post_count=$(git diff --staged --name-only -- '_posts/' | wc -l)" >> "$GITHUB_OUTPUT"
          else
            echo "No new posts generated"
            echo "has_new_posts=false" >> "$GITHUB_OUTPUT"
          fi

      # 빌드가 성공한 뒤에만 커밋/푸시한다. (빌드를 깨는 글이 저장소에 남아 이후 실행까지 망가뜨리는 것을 방지)
      - name: Setup Pages
        if: steps.detect.outputs.has_new_posts == 'true'
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        if: steps.detect.outputs.has_new_posts == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build Jekyll site
        if: steps.detect.outputs.has_new_posts == 'true'
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Commit and push new posts
        if: steps.detect.outputs.has_new_posts == 'true'
        run: |
          git config --local user.email "eodnr9221@gmail.com"
          git config --local user.name "Daewook Kwon"
          git commit -m "📝 Auto-generated ${{ steps.detect.outputs.post_count }} post(s) - $(date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD

      - name: Upload site artifact
        if: steps.detect.outputs.has_new_posts == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.has_new_posts == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
